<template>
    <lightning-quick-action-panel header="Edit">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>    
        <lightning-record-edit-form record-id={recordId} object-api-name={objectApiName} onsubmit={handleSubmit}>
            <lightning-layout multiple-rows>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Salutation_TH__c"></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Name" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Address__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Street__c"></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="District__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Subdistrict__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Province__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Zipcode__c" required></lightning-input-field>
                </lightning-layout-item>
                <!-- <lightning-input-address
                    address-label="Address"
                    street-label="Street"
                    city-label="City"
                    country-label="Country"
                    province-label="State"
                    postal-code-label="PostalCode"
                    street={street}
                    city="San Francisco"
                    country="US"
                    province="CA"
                    postal-code="94105"
                    field-level-help="Enter your billing address"
                >
                </lightning-input-address> -->
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Mobile_Phone__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Phone"></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Fax"></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Email__c"></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Tax_Number__c" required></lightning-input-field>
                </lightning-layout-item>
                <lightning-layout-item size="6" >
                    <lightning-input-field field-name="Remark__c"></lightning-input-field>
                </lightning-layout-item>
                <!-- <div class="slds-docked-form-footer"> -->
                    <lightning-layout-item size="6" padding="around-small" >
                        <lightning-button variant="neutral" class="slds-float_right" label="Cancel" onclick={handleClose}></lightning-button>
                    </lightning-layout-item>
                    <lightning-layout-item size="6" padding="around-small" >
                        <lightning-button variant="brand" class="slds-float_left" type="submit" label="Save"></lightning-button>
                    </lightning-layout-item>
                <!-- </div> -->
            </lightning-layout>
        </lightning-record-edit-form>
    </lightning-quick-action-panel>
</template>
